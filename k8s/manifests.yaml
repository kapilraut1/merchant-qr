apiVersion: v1
kind: Namespace
metadata:
  name: merchant-settlement
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: merchant-settlement
data:
  ENVIRONMENT: production
  SETTLEMENT_CURRENCY: NPR
  SETTLEMENT_TIMEZONE: UTC
  CORS_ORIGINS: "https://merchant.example.com"
  # The API base URL is baked into the frontend bundle at build time, so the
  # image tag, not a ConfigMap, is what points it at a different backend.
  VITE_API_BASE_URL: "https://api.merchant.example.com"
---
# Secrets are referenced, never defined here. Create the real object out of
# band:  kubectl -n merchant-settlement create secret generic backend-secrets \
#    --from-literal=DATABASE_URL=... --from-literal=REDIS_URL=... \
#    --from-literal=JWT_SECRET=...
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: merchant-settlement
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgresql+psycopg://wallet:CHANGE_ME@postgres:5432/wallet"
  REDIS_URL: "redis://redis:6379/0"
  JWT_SECRET: "CHANGE_ME"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: merchant-settlement
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: merchant-settlement
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: merchant-settlement
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: merchant-qr-settlement-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          # Schema is owned by the API process. Running it as an initContainer
          # with a leader-elected migration job would be the next step up; for a
          # single migration this gate is enough to keep the API from serving
          # against a half-built schema.
          initContainers:
            - name: migrate
              image: merchant-qr-settlement-backend:latest
              command: ["alembic", "upgrade", "head"]
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            # /health touches no dependency on purpose: a database blip must
            # not restart every API pod at once.
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: merchant-settlement
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: merchant-qr-settlement-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: merchant-settlement
  labels:
    app: worker
spec:
  # Exactly one worker by default: settlement locks the merchant row, so extra
  # replicas buy throughput on unrelated work, not duplicate-batch safety.
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: merchant-qr-settlement-backend:latest
          command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
  namespace: merchant-settlement
  labels:
    app: beat
spec:
  # Beat must stay a singleton: two schedulers would publish the nightly batch
  # twice. The task is idempotent, so the damage is bounded, but there is no
  # reason to run it.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: beat
  template:
    metadata:
      labels:
        app: beat
    spec:
      containers:
        - name: beat
          image: merchant-qr-settlement-backend:latest
          command:
            - celery
            - -A
            - app.celery_app.celery_app
            - beat
            - --loglevel=info
            # Written to emptyDir-backed /tmp: the container filesystem is
            # ephemeral, which is exactly what a scheduler state file wants.
            - --schedule=/tmp/celerybeat-schedule
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
# PostgreSQL. A StatefulSet with a volume claim because settlement history is
# the merchant's statement of record and must survive a pod restart.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: merchant-settlement
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: merchant-settlement
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: wallet
            - name: POSTGRES_DB
              value: wallet
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "wallet", "-d", "wallet"]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: merchant-settlement
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: merchant-settlement
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
