name: merchant-qr-settlement

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    # One image shared by backend/worker/beat. Declaring the same explicit
    # `image` name everywhere means the stack builds the Python image once
    # instead of three times, and the three services can never drift apart.
    image: merchant-qr-settlement-backend:latest
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # --reload is deliberately not used here: Docker Desktop's Windows bind
    # mounts cannot deliver inotify events, so the reloader dies with
    # "Cannot allocate memory". Source is still bind-mounted, so
    # `docker compose restart backend` picks up edits without a rebuild.
    environment:
      DATABASE_URL: postgresql+psycopg://wallet:wallet@postgres:5432/wallet
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      JWT_SECRET: dev-secret-change-me
    ports:
      - "8000:8000"
    # Source is bind-mounted for live reload. Dependencies stay in the image
    # layer, which the Docker cache invalidates only when pyproject.toml
    # changes -- so never mount a volume over site-packages here.
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    image: merchant-qr-settlement-backend:latest
    # No migrations here: the backend service owns schema changes, and depends_on
    # below guarantees it finished `alembic upgrade head` before this starts.
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg://wallet:wallet@postgres:5432/wallet
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      JWT_SECRET: dev-secret-change-me
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: merchant-qr-settlement-backend:latest
    # Beat just publishes the nightly job to Redis every 24h. Re-publishing
    # after a restart is harmless because settlement is idempotent: a second
    # run for the same day finds nothing unsettled and exits.
    # --schedule points outside the bind mount on purpose: Celery's
    # PersistentScheduler writes its state file to the working directory, and
    # /app is the repo, so the default would drop a binary blob in the tree.
    command: >
      celery -A app.celery_app.celery_app beat --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    environment:
      DATABASE_URL: postgresql+psycopg://wallet:wallet@postgres:5432/wallet
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      JWT_SECRET: dev-secret-change-me
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
