[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "merchant-settlement-backend"
version = "0.1.0"
description = "Merchant QR settlement and reconciliation service"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "pydantic-settings==2.7.0",
    "pyjwt==2.10.1",
    "email-validator==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.8.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
# `alembic/` and `tests/` are top-level directories, so ruff would otherwise
# classify them as first-party application code.
known-first-party = ["app"]
known-third-party = ["alembic", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Resolve `app` from the working tree, not from the copy baked into the image.
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing"
filterwarnings = ["error::DeprecationWarning:app.*"]
